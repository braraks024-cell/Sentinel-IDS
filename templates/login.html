{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">NETWORK DEFENSE CONSOLE</p>
  <h1>Welcome back</h1>
  <p class="muted">Log in to analyze traffic and review your reports.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username<input name="username" autocomplete="username" required maxlength="40"></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="button primary full" type="submit">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</section>
{% endblock %}
